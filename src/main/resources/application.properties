spring.application.name=donatrack-frontend
server.port=8080

# ── Servicios de aplicación (todo por variables de entorno en Docker) ─────────
donatrack.servicios.donaciones=${SERVICIOS_DONACIONES_URL:http://localhost:8081}
donatrack.servicios.incentivos=${SERVICIOS_INCENTIVOS_URL:http://localhost:8083}
donatrack.servicios.notificaciones=${SERVICIOS_NOTIFICACIONES_URL:http://localhost:8084}
donatrack.servicios.logistica=${SERVICIOS_LOGISTICA_URL:http://localhost:8085}
donatrack.servicios.autenticacion=${SERVICIOS_AUTENTICACION_URL:http://localhost:8088}

# Acceso de demostración (sin Google). Poner false en un entorno real.
donatrack.demo-enabled=${DONATRACK_DEMO:false}

# ── Login social con Google (OIDC) ────────────────────────────────────────────
# Las credenciales NO van en el repo: se pasan por variables de entorno
# (GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET). Sin ellas, el front arranca igual y
# el botón de Google se oculta (ver GoogleClientConfig). URI de redirección autorizada en Google Cloud:
#   http://localhost:8080/login/oauth2/code/google
donatrack.google.client-id=${GOOGLE_CLIENT_ID:}
donatrack.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ── Sesión y vistas ───────────────────────────────────────────────────────────
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false
spring.messages.fallback-to-system-locale=false
server.error.whitelabel.enabled=false

# Detrás de un proxy (Codespaces, Docker, un balanceador) el front tiene que
# respetar el host y https que le informa el proxy; si no, la redirección de
# Google se arma con la dirección interna y falla.
server.forward-headers-strategy=framework

donatrack.auth.clave-frontend=${AUTH_FRONTEND_KEY:}

# Importación de donantes por CSV: el archivo puede tener miles de filas.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
