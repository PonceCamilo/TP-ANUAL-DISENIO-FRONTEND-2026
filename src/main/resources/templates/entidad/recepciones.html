<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/base :: pagina('Recepciones', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/entidad/panel}" data-carga><svg th:replace="~{fragmentos/componentes :: ic('arrow-left')}"></svg>Mi entidad</a></nav>
    <div class="encabezado-pagina"><div><h1>Recepciones</h1><p>Donaciones asignadas a tu entidad y su estado.</p></div></div>
    <ul class="lista" th:if="${!donaciones.isEmpty()}">
      <li class="item" th:each="d : ${donaciones}">
        <div class="item-cuerpo"><span class="icono-circulo"><svg th:replace="~{fragmentos/componentes :: ic('truck')}"></svg></span><div>
          <p class="item-titulo" th:text="${d.descripcion}">Frazadas</p>
          <p class="suave chico">
            <span th:each="b, it : ${d.bienes}" th:text="${b.cantidad} + ' ' + ${b.unidad} + (${it.last} ? '' : ', ')"></span>
          </p>
        </div></div>
        <span th:replace="~{fragmentos/componentes :: estado(${d.estado})}"></span>
      </li>
    </ul>
    <th:block th:if="${donaciones.isEmpty()}">
      <div th:replace="~{fragmentos/componentes :: vacio('truck', 'Aún no recibiste donaciones', 'Mirá las donaciones disponibles y aceptá las que te sirvan.', '/entidad/disponibles', 'Ver donaciones disponibles')}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
