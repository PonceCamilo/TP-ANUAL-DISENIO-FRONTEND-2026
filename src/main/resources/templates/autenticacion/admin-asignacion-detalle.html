<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina(${area}, ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/admin/asignacion}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Asignación</a></nav>
    <div class="encabezado-pagina">
      <div>
        <h1 th:text="${donacion.descripcion}">Descripción</h1>
        <p><span th:text="${donacion.subcategoria}">Subcategoría</span> ·
           <span th:replace="~{comun/fragmentos/componentes :: estado(${donacion.estado})}"></span></p>
      </div>
    </div>

    <section class="tarjeta seccion" th:if="${!#lists.isEmpty(candidatos.coincidencias)}" aria-label="Coincidencias">
      <p class="estado estado-ok"><svg th:replace="~{comun/fragmentos/componentes :: ic('check')}"></svg>
        Hubo coincidencia: todos los algoritmos recomiendan a la/s misma/s entidad/es.
      </p>
      <ul class="lista">
        <li class="item" th:each="e : ${candidatos.coincidencias}">
          <div class="item-cuerpo">
            <span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('building')}"></svg></span>
            <p class="item-titulo" th:text="${e.razonSocial}">Entidad</p>
          </div>
        </li>
      </ul>
    </section>

    <section class="tarjeta seccion" aria-labelledby="titulo-rankings">
      <h2 id="titulo-rankings">Resultado de los algoritmos</h2>
      <div class="grilla-2">
        <div th:each="r : ${candidatos.rankings}">
          <h3 th:text="${r.algoritmo}">Algoritmo</h3>
          <ol class="lista-ranking" th:if="${!#lists.isEmpty(r.entidades)}">
            <li th:each="e, it : ${r.entidades}">
              <span class="puesto" th:text="${it.index} + 1">1</span>
              <span th:text="${e.razonSocial}">Entidad</span>
            </li>
          </ol>
          <p class="suave chico" th:if="${#lists.isEmpty(r.entidades)}">Sin candidatas para este algoritmo.</p>
        </div>
      </div>
    </section>

    <section class="tarjeta seccion" aria-labelledby="titulo-confirmar">
      <h2 id="titulo-confirmar">Confirmar destino</h2>
      <form th:action="@{/admin/asignacion/{id}/asignar(id=${donacion.id})}" method="post" class="formulario" data-carga>
        <div class="campo">
          <label for="id-entidad">Entidad beneficiaria</label>
          <select id="id-entidad" name="idEntidadBeneficiaria" required>
            <option value="" disabled selected>Elegí una entidad</option>
            <option th:each="e : ${candidatos.coincidencias}" th:value="${e.id}" th:text="${e.razonSocial} + ' (coincidencia)'">Entidad</option>
            <th:block th:each="r : ${candidatos.rankings}">
              <option th:each="e : ${r.entidades}" th:value="${e.id}"
                      th:text="${e.razonSocial} + ' — ' + ${r.algoritmo}">Entidad</option>
            </th:block>
          </select>
        </div>
        <button class="btn btn-sol" type="submit" data-cargando="Asignando…">Confirmar asignación</button>
      </form>
    </section>
  </div>
</main>
</body>
</html>
