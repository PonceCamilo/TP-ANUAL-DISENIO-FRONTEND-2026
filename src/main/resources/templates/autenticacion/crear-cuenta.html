<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Crear cuenta', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <div class="centrado">
      <nav class="migas" aria-label="Ruta"><a th:href="@{/login(rol=${rol})}"><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Volver a ingresar</a></nav>

      <div class="segmentos" role="navigation" aria-label="Tipo de cuenta">
        <a th:href="@{/crear-cuenta(rol='DONANTE')}" th:aria-current="${rol == 'DONANTE'} ? 'page'"><svg th:replace="~{comun/fragmentos/componentes :: ic('gift')}"></svg>Soy donante</a>
        <a th:href="@{/crear-cuenta(rol='ENTIDAD_BENEFICIARIA')}" th:aria-current="${rol == 'ENTIDAD_BENEFICIARIA'} ? 'page'"><svg th:replace="~{comun/fragmentos/componentes :: ic('building')}"></svg>Soy entidad</a>
      </div>

      <h1 th:text="${rol == 'ENTIDAD_BENEFICIARIA'} ? 'Creá la cuenta de tu entidad' : 'Creá tu cuenta'">Creá tu cuenta</h1>
      <p class="suave" th:text="${rol == 'ENTIDAD_BENEFICIARIA'} ? 'Después te pedimos los datos de la entidad.' : 'Tarda menos de un minuto.'">Texto</p>

      <div class="tarjeta">
        <form th:action="@{/crear-cuenta}" method="post" class="formulario" data-carga data-repetir>
          <input type="hidden" name="rol" th:value="${rol}">
          <div class="campo" th:if="${rol == 'DONANTE'}">
            <label for="tipoDonante">¿A nombre de quién donás?</label>
            <select id="tipoDonante" name="tipoDonante">
              <option value="HUMANA" th:selected="${tipoDonanteIngresado != 'JURIDICA'}">Persona humana</option>
              <option value="JURIDICA" th:selected="${tipoDonanteIngresado == 'JURIDICA'}">Persona jurídica</option>
            </select>
          </div>
          <div class="campo">
            <label for="nombre" th:text="${rol == 'ENTIDAD_BENEFICIARIA'} ? 'Tu nombre (quien administra la cuenta)' : 'Tu nombre'">Tu nombre</label>
            <input id="nombre" name="nombre" required maxlength="100" autocomplete="name" th:value="${nombreIngresado}">
          </div>
          <div class="campo">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required maxlength="150" autocomplete="email" th:value="${emailIngresado}" aria-describedby="email-ayuda">
            <p id="email-ayuda" class="ayuda">Es con el que vas a ingresar y donde te avisamos.</p>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <div class="clave">
              <input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="clave-ayuda">
              <button type="button" data-mostrar-clave="password" aria-pressed="false">Mostrar</button>
            </div>
            <p id="clave-ayuda" class="ayuda">Al menos 8 caracteres.</p>
          </div>
          <div class="campo">
            <label for="repetir">Repetí la contraseña</label>
            <input id="repetir" name="repetir" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
          </div>
          <button class="btn btn-sol btn-grande" type="submit" data-cargando="Creando cuenta…">Crear cuenta</button>
        </form>

        <div class="separador" th:if="${googleDisponible}">o</div>
        <a class="btn btn-google btn-grande" th:if="${googleDisponible}" th:href="@{/login/google(rol=${rol})}" data-carga style="width:100%">Registrarme con Google</a>
        <a class="btn btn-secundario btn-grande" th:if="${googleDisponible and rol == 'DONANTE'}"
           th:href="@{/login/google(rol='DONANTE',tipoDonante='JURIDICA')}" data-carga>Registrar donante jurídico con Google</a>
      </div>

      <p class="pie-form">¿Ya tenés cuenta? <a th:href="@{/login(rol=${rol})}">Ingresá</a></p>
    </div>
  </div>
</main>
</body>
</html>
