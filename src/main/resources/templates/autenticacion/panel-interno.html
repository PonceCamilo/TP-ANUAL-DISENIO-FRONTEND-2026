<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina(${area}, ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <section class="portada" aria-labelledby="titulo-area">
      <h1 id="titulo-area" th:text="${area}">Área interna</h1>
      <p th:text="${descripcionArea}">Área interna de DonaTrack</p>
    </section>
    <section class="tarjeta seccion" th:if="${usuario.rol == 'CHOFER'}">
      <h2>Mi camión</h2>
      <p th:if="${camionAsignado == null}">Todavía no tenés un camión asignado.</p>
      <p th:if="${camionAsignado != null}" th:text="${camionAsignado}">Camión asignado</p>
    </section>
  </div>
</main>
</body>
</html>
