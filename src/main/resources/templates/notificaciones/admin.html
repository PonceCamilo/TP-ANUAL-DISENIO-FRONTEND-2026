<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Avisos', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <div class="encabezado-pagina"><div><h1>Avisos</h1><p>Alertas del sistema, como entregas que no se pudieron concretar.</p></div></div>
    <th:block th:if="${!notificaciones.isEmpty()}">
      <ul th:replace="~{comun/fragmentos/componentes :: avisos(${notificaciones})}"></ul>
    </th:block>
    <th:block th:if="${notificaciones.isEmpty()}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('bell', 'Sin avisos por ahora', 'Te avisamos acá si una entrega no se puede concretar.', null, null)}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
