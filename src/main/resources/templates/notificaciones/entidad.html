<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Avisos', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/entidad/panel}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Mi entidad</a></nav>
    <div class="encabezado-pagina"><div><h1>Avisos</h1><p>Los mensajes que enviamos a tu entidad.</p></div></div>
    <th:block th:if="${!notificaciones.isEmpty()}">
      <ul th:replace="~{comun/fragmentos/componentes :: avisos(${notificaciones})}"></ul>
    </th:block>
    <th:block th:if="${notificaciones.isEmpty()}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('bell', 'Sin avisos por ahora', 'Te avisamos cuando se asigne una donación o cuando salga a camino.', null, null)}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
