<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Ícono del sprite (decorativo: el texto que lo acompaña es el que se lee) -->
<svg th:fragment="ic(nombre)" class="ic" aria-hidden="true" focusable="false"><use th:href="'#i-' + ${nombre}"></use></svg>

<!-- Tooltip accesible: funciona con mouse y con teclado -->
<span class="tip" th:fragment="ayuda(id, texto)">
  <button type="button" class="tip-boton" aria-label="Más información" th:aria-describedby="${'tip-' + id}">
    <svg th:replace="~{comun/fragmentos/componentes :: ic('help')}"></svg>
  </button>
  <span class="tip-texto" role="tooltip" th:id="${'tip-' + id}" th:text="${texto}"></span>
</span>

<!-- Estado con ícono + texto (no depende solo del color) -->
<span th:fragment="estado(codigo)" class="estado" th:classappend="${'estado-' + @etiquetas.variante(codigo)}">
  <svg class="ic" aria-hidden="true" focusable="false"><use th:href="'#i-' + ${@etiquetas.icono(codigo)}"></use></svg>
  <span th:text="${@etiquetas.estado(codigo)}">En depósito</span>
</span>

<!-- Recorrido de una donación: cinco paradas, como seguir un envío -->
<ol class="recorrido" th:fragment="recorrido(codigo)" th:aria-label="'Recorrido de la donación. Estado: ' + ${@etiquetas.estado(codigo)}">
  <li th:each="p : ${@etiquetas.recorrido(codigo)}" th:class="${p.clase}">
    <span class="punto"><svg class="ic" aria-hidden="true" focusable="false"><use th:href="'#i-' + ${p.icono}"></use></svg></span>
    <span th:text="${p.nombre}">En depósito</span>
    <span class="solo-lectores" th:text="${p.leyenda}">completado</span>
  </li>
</ol>

<!-- Estado vacío: explica qué falta y ofrece el siguiente paso -->
<div th:fragment="vacio(icono, titulo, texto, url, accion)" class="tarjeta vacio">
  <div class="circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic(${icono})}"></svg></div>
  <h2 th:text="${titulo}">Todavía no hay nada</h2>
  <p th:text="${texto}">Texto</p>
  <a class="btn" th:if="${url != null}" th:href="@{${url}}" th:text="${accion}" data-carga>Empezar</a>
</div>

<!-- Lista de avisos recibidos por email/WhatsApp/SMS/Discord -->
<ul class="lista" th:fragment="avisos(items)">
  <li class="item" th:each="n : ${items}">
    <div class="item-cuerpo">
      <span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('bell')}"></svg></span>
      <div>
        <p class="item-titulo" th:if="${!#strings.contains(n.mensaje, 'Motivo:')}" th:text="${n.mensaje}">Mensaje</p>
        <p class="item-titulo" th:if="${#strings.contains(n.mensaje, 'Motivo:')}">
          <span th:text="${#strings.substringBefore(n.mensaje, 'Motivo:')}">Intro</span><br>
          <span th:text="'Motivo:' + ${#strings.substringAfter(n.mensaje, 'Motivo:')}">Motivo</span>
        </p>
        <p class="suave chico" style="margin:0">
          <span th:text="${n.medio}">EMAIL</span> ·
          <time th:datetime="${n.fechaCreacion}" th:text="${#strings.replace(#strings.substring(n.fechaCreacion, 0, 16), 'T', ' ')}">2026-06-24 19:07</time>
        </p>
      </div>
    </div>
    <span class="estado" th:classappend="${n.estado == 'FALLIDA'} ? 'estado-error' : (${n.estado == 'ENVIADA'} ? 'estado-ok' : 'estado-warn')">
      <svg th:replace="${n.estado == 'FALLIDA'} ? ~{comun/fragmentos/componentes :: ic('alert')} : ~{comun/fragmentos/componentes :: ic('check')}"></svg>
      <span th:text="${n.estado == 'FALLIDA'} ? 'No se pudo enviar' : (${n.estado == 'ENVIADA'} ? 'Enviado' : 'En cola')">Enviado</span>
    </span>
  </li>
</ul>

<!-- Modal de confirmación para acciones que no se pueden deshacer -->
<dialog th:fragment="confirmar(id, titulo)" th:id="${id}" class="modal" th:aria-labelledby="${id + '-t'}">
  <h2 th:id="${id + '-t'}" th:text="${titulo}">¿Seguro?</h2>
  <p data-detalle>Esta acción no se puede deshacer.</p>
  <form method="post" th:action="@{/}">
    <div class="fila">
      <button type="button" class="btn btn-secundario" data-cancelar>Cancelar</button>
      <button type="submit" class="btn btn-peligro">Eliminar</button>
    </div>
  </form>
</dialog>

</body>
</html>
