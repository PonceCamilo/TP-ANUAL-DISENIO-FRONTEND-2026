<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Despachos', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav th:replace="~{donaciones/admin/fragmentos :: pestanias(${pestania})}"></nav>

    <div class="encabezado-pagina">
      <div><h1>Despachar a logística</h1>
        <p>Donaciones con entidad asignada que todavía no salieron. Marcá las que querés mandar juntas.</p></div>
    </div>

    <form th:if="${!donaciones.isEmpty()}" method="post" th:action="@{/admin/donaciones/despachos}" class="pila" data-carga>
      <fieldset class="campo" style="border:0;padding:0;margin:0">
        <legend class="solo-lectores">Donaciones para despachar</legend>
        <ul class="lista">
          <li th:each="d : ${donaciones}">
            <label class="item" style="cursor:pointer">
              <span class="item-cuerpo">
                <input type="checkbox" name="ids" th:value="${d.id}" style="width:24px;height:24px;accent-color:var(--c-ruta)">
                <span>
                  <span class="item-titulo" style="display:block" th:text="${d.descripcion}">Frazadas</span>
                  <span class="suave chico">
                    <span th:text="${d.subcategoria}">Abrigo</span>
                    <th:block th:if="${!d.razonSocial.isEmpty()}"> · para <span th:text="${d.razonSocial}">Comedor</span></th:block>
                  </span>
                </span>
              </span>
            </label>
          </li>
        </ul>
      </fieldset>
      <div class="fila">
        <div class="campo" style="min-width:15rem">
          <label for="proveedor">Con</label>
          <select id="proveedor" name="proveedor">
            <option value="">El que esté disponible</option>
            <option value="DONATRACK">Flota de DonaTrack</option>
            <option value="EXTERNA">Logística externa</option>
          </select>
        </div>
        <button class="btn btn-sol" type="submit" data-cargando="Despachando…" style="align-self:flex-end">
          <svg th:replace="~{comun/fragmentos/componentes :: ic('truck')}"></svg>Despachar las marcadas</button>
      </div>
    </form>

    <th:block th:if="${donaciones.isEmpty()}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('truck', 'No hay donaciones para despachar', 'Cuando asignes una donación a una entidad, va a aparecer acá para mandarla a logística.', '/admin/donaciones/por-asignar', 'Ver las que faltan asignar')}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
