<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Registrar donación', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav th:replace="~{donaciones/admin/fragmentos :: pestanias(${pestania})}"></nav>
    <nav class="migas" aria-label="Ruta"><a th:href="@{/admin/donaciones}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Donaciones</a></nav>
    <div class="encabezado-pagina"><div><h1>Registrar una donación</h1>
      <p>A nombre de una persona donante ya registrada, por ejemplo si la entregó en el depósito.</p></div></div>

    <form class="formulario" method="post" th:action="@{/admin/donaciones/nueva}" data-carga>
      <div class="campo">
        <label for="emailDonante">Email de la persona donante <span class="requerido" aria-hidden="true">*</span></label>
        <input id="emailDonante" name="emailDonante" type="email" required maxlength="150" autocomplete="off" aria-describedby="email-ayuda">
        <p id="email-ayuda" class="ayuda">Si todavía no está registrada, dala de alta primero en Donantes.</p>
      </div>

      <fieldset class="campo">
        <legend>Tipo de donación <span class="requerido" aria-hidden="true">*</span></legend>
        <div class="chips-tipo">
          <label class="chip"><input type="radio" name="subcategoria" value="Abrigo" required><span><svg th:replace="~{comun/fragmentos/componentes :: ic('shirt')}"></svg>Abrigo</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Alimentos"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('food')}"></svg>Alimentos</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Útiles escolares"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('book')}"></svg>Útiles escolares</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Higiene personal"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('drop')}"></svg>Higiene personal</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Juguetes"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('star')}"></svg>Juguetes</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Muebles"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('sofa')}"></svg>Muebles</span></label>
          <label class="chip"><input type="radio" name="subcategoria" value="Otro"><span><svg th:replace="~{comun/fragmentos/componentes :: ic('dots')}"></svg>Otro</span></label>
        </div>
      </fieldset>

      <div data-muestra-si="subcategoria=Otro" hidden><div class="campo">
        <label for="subcategoriaOtra">¿Qué tipo es?</label>
        <input id="subcategoriaOtra" name="subcategoriaOtra" maxlength="60" placeholder="Ej.: Equipo de pesca">
      </div></div>

      <div class="campo">
        <label for="descripcion">Título <span class="requerido" aria-hidden="true">*</span></label>
        <input id="descripcion" name="descripcion" type="text" required maxlength="120" placeholder="Ej.: Camperas para el invierno">
      </div>

      <div class="grupo-2">
        <div class="campo">
          <label for="cantidad">Cantidad <span class="requerido" aria-hidden="true">*</span></label>
          <div class="cantidad">
            <button type="button" data-paso="-1" aria-label="Restar uno"><svg th:replace="~{comun/fragmentos/componentes :: ic('minus')}"></svg></button>
            <input id="cantidad" name="cantidad" type="number" min="1" value="1" required inputmode="numeric">
            <button type="button" data-paso="1" aria-label="Sumar uno"><svg th:replace="~{comun/fragmentos/componentes :: ic('plus')}"></svg></button>
          </div>
        </div>
        <div class="campo">
          <label for="unidad">Unidad</label>
          <select id="unidad" name="unidad">
            <option value="unidades">Unidades</option><option value="kg">Kilos</option>
            <option value="litros">Litros</option><option value="cajas">Cajas</option>
          </select>
        </div>
      </div>

      <fieldset class="campo">
        <legend>Estado</legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="esNuevo" value="true" checked> Nuevo</label>
          <label class="opcion"><input type="radio" name="esNuevo" value="false"> Usado</label>
        </div>
      </fieldset>

      <div class="campo">
        <label for="detalle">Detalle <span class="suave" style="font-weight:500">(opcional)</span></label>
        <textarea id="detalle" name="detalle" maxlength="300" placeholder="Talles, marcas, estado…"></textarea>
      </div>

      <div class="campo">
        <label for="fechaVencimiento">Fecha de vencimiento <span class="suave" style="font-weight:500">(opcional)</span></label>
        <input id="fechaVencimiento" name="fechaVencimiento" type="date" data-desde-hoy aria-describedby="vence-ayuda">
        <p id="vence-ayuda" class="ayuda">No se aceptan bienes vencidos: la fecha tiene que ser hoy o posterior.</p>
      </div>

      <div class="campo">
        <label for="foto">Foto <span class="suave" style="font-weight:500">(opcional)</span>
          <span th:replace="~{comun/fragmentos/componentes :: ayuda('foto', 'Pegá el enlace de una foto ya publicada (empieza con https://). Puede aparecer en la página de inicio cuando la donación se entregue.')}"></span>
        </label>
        <input id="foto" name="foto" type="url" maxlength="2048" inputmode="url" placeholder="https://…" pattern="https?://\S+">
      </div>

      <div class="fila">
        <button type="submit" class="btn btn-sol btn-grande btn-bloque" data-cargando="Registrando…"><svg th:replace="~{comun/fragmentos/componentes :: ic('gift')}"></svg>Registrar donación</button>
        <a class="btn btn-secundario btn-grande btn-bloque" th:href="@{/admin/donaciones}" data-carga>Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
