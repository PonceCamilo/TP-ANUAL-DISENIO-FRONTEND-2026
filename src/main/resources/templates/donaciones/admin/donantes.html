<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Donantes', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav th:replace="~{donaciones/admin/fragmentos :: pestanias(${pestania})}"></nav>

    <div class="encabezado-pagina">
      <div><h1>Personas donantes</h1><p>Personas y organizaciones registradas.</p></div>
      <div class="fila">
        <a class="btn btn-secundario" th:href="@{/admin/donantes/importar}" data-carga>Importar CSV</a>
        <a class="btn btn-sol" th:href="@{/admin/donantes/nuevo}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('plus')}"></svg>Registrar donante</a>
      </div>
    </div>

    <form method="get" th:action="@{/admin/donantes}" class="tarjeta" aria-label="Filtrar donantes" style="margin-bottom: var(--s-5)">
      <div class="fila" style="align-items:flex-end">
        <div class="campo" style="flex:1;min-width:14rem">
          <label for="email">Buscar por email</label>
          <input id="email" name="email" type="email" th:value="${filtros.email}" placeholder="persona@ejemplo.com">
        </div>
        <div class="campo" style="min-width:12rem">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="" th:selected="${filtros.estado == null or filtros.estado == ''}">Todos</option>
            <option value="ACTIVO" th:selected="${filtros.estado == 'ACTIVO'}">Activas</option>
            <option value="INACTIVO" th:selected="${filtros.estado == 'INACTIVO'}">Inactivas</option>
            <option value="BLOQUEADO" th:selected="${filtros.estado == 'BLOQUEADO'}">Bloqueadas</option>
          </select>
        </div>
        <a class="btn btn-secundario" th:if="${hayFiltros}" th:href="@{/admin/donantes}" data-carga>Limpiar</a>
        <button class="btn" type="submit"><svg th:replace="~{comun/fragmentos/componentes :: ic('search')}"></svg>Buscar</button>
      </div>
    </form>

    <th:block th:if="${!pagina.vacia}">
      <p class="suave chico" th:text="${pagina.totalElementos == 1} ? '1 persona' : ${pagina.totalElementos} + ' personas'">8 personas</p>
      <ul class="lista">
        <li class="item" th:each="d : ${donantes}" style="flex-wrap:wrap">
          <div class="item-cuerpo">
            <span class="icono-circulo"><svg th:replace="${d['razonSocial'] != null} ? ~{comun/fragmentos/componentes :: ic('building')} : ~{comun/fragmentos/componentes :: ic('gift')}"></svg></span>
            <div>
              <p class="item-titulo" th:text="${d.nombreVisible}">Ana Pérez</p>
              <p class="suave chico" style="margin:0">
                <span th:text="${d.email}">ana@example.com</span> ·
                <span th:text="${d.tipoDocumento} + ' ' + ${d.numeroDocumento}">DNI 30111222</span>
              </p>
            </div>
          </div>
          <div class="fila">
            <span th:replace="~{donaciones/admin/fragmentos :: estadoDonante(${d.estado})}"></span>
            <details th:if="${!d.destinos.isEmpty()}">
              <summary class="btn btn-secundario">Cambiar estado</summary>
              <form method="post" th:action="@{/admin/donantes/{id}/estado(id=${d.id})}" class="pila tarjeta" style="margin-top: var(--s-2)" data-carga>
                <fieldset class="campo">
                  <legend class="solo-lectores">Nuevo estado</legend>
                  <div class="opciones">
                    <label class="opcion" th:each="e, i : ${d.destinos}">
                      <input type="radio" name="estado" th:value="${e}" th:checked="${i.first}" required>
                      <span th:text="${e == 'ACTIVO'} ? 'Activar' : (${e == 'BLOQUEADO'} ? 'Bloquear' : 'Pasar a inactiva')">Activar</span>
                    </label>
                  </div>
                </fieldset>
                <div class="campo">
                  <label th:for="${'motivo-' + d.id}">Motivo <span class="suave" style="font-weight:500">(obligatorio para bloquear)</span></label>
                  <input th:id="${'motivo-' + d.id}" name="justificacion" maxlength="300">
                </div>
                <button class="btn" type="submit" data-cargando="Guardando…">Guardar</button>
              </form>
            </details>
            <button type="button" class="btn btn-secundario btn-icono" data-modal="confirmar-baja"
                    th:data-accion="@{/admin/donantes/{id}/eliminar(id=${d.id})}"
                    th:data-detalle="${'Se elimina a ' + d.nombreVisible + '. Si tiene donaciones registradas, el servicio no lo permite.'}"
                    th:aria-label="'Eliminar a ' + ${d.nombreVisible}">
              <svg th:replace="~{comun/fragmentos/componentes :: ic('trash')}"></svg></button>
          </div>
        </li>
      </ul>
      <nav th:replace="~{donaciones/admin/fragmentos :: paginador(${pagina}, ${urlAnterior}, ${urlSiguiente})}"></nav>
    </th:block>
    <th:block th:if="${pagina.vacia}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('search', 'No encontramos personas donantes', 'Probá con otro email o estado, o registrá una nueva.', '/admin/donantes/nuevo', 'Registrar donante')}"></div>
    </th:block>

    <dialog th:replace="~{comun/fragmentos/componentes :: confirmar('confirmar-baja', '¿Eliminar a esta persona donante?')}"></dialog>
  </div>
</main>
</body>
</html>
