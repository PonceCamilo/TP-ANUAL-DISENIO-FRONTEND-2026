<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Recepciones', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/entidad/panel}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Mi entidad</a></nav>
    <div class="encabezado-pagina"><div><h1>Recepciones</h1><p>Donaciones asignadas a tu entidad y su estado. Cuando una llegue, confirmala con fotos.</p></div></div>
    <form class="fila" method="get" th:action="@{/entidad/recepciones}" th:if="${hayAlguna}" style="gap: var(--s-3); margin-bottom: var(--s-4)">
      <div class="campo" style="margin:0">
        <label for="estado">Estado</label>
        <select id="estado" name="estado" onchange="this.form.submit()">
          <option value="" th:selected="${estado == ''}">Todas</option>
          <option value="ASIGNACION_REALIZADA" th:selected="${estado == 'ASIGNACION_REALIZADA'}">Asignadas</option>
          <option value="LISTA_PARA_ENTREGAR" th:selected="${estado == 'LISTA_PARA_ENTREGAR'}">Listas para salir</option>
          <option value="EN_TRASLADO" th:selected="${estado == 'EN_TRASLADO'}">En camino</option>
          <option value="ENTREGADA" th:selected="${estado == 'ENTREGADA'}">Entregadas</option>
          <option value="ENTREGA_FALLIDA" th:selected="${estado == 'ENTREGA_FALLIDA'}">No se pudieron entregar</option>
        </select>
      </div>
      <noscript><button class="btn btn-secundario" type="submit">Filtrar</button></noscript>
    </form>
    <ul class="lista" th:if="${!donaciones.isEmpty()}">
      <li class="item" th:each="d : ${donaciones}">
        <div class="item-cuerpo"><span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('truck')}"></svg></span><div>
          <p class="item-titulo" th:text="${d.descripcion}">Frazadas</p>
          <p class="suave chico">
            <span th:each="b, it : ${d.bienes}" th:text="${b.cantidad} + ' ' + ${b.unidad} + (${it.last} ? '' : ', ')"></span>
          </p>
        </div></div>
        <div class="fila" style="gap: var(--s-3)">
          <span th:replace="~{comun/fragmentos/componentes :: estado(${d.estado})}"></span>
          <a class="btn btn-secundario" th:if="${d.estado == 'EN_TRASLADO' and d['idRutaLogistica'] != null}"
             th:href="@{/tracking/ruta/{ruta}(ruta=${d['idRutaLogistica']})}" data-carga>
            <svg th:replace="~{comun/fragmentos/componentes :: ic('pin')}"></svg>Ver en el mapa</a>
          <a class="btn btn-sol" th:if="${d.estado == 'EN_TRASLADO'}"
             th:href="@{/recepcion(donacion=${d.id})}" data-carga>Confirmar recepción</a>
          <a class="btn btn-secundario" th:if="${d.estado == 'LISTA_PARA_ENTREGAR'}"
             th:href="@{/recepcion(donacion=${d.id})}" data-carga>Ver la entrega</a>
          <a class="btn btn-secundario" th:if="${d.estado == 'ENTREGADA'}"
             th:href="@{/recepcion(donacion=${d.id})}" data-carga>Ver la recepción</a>
        </div>
      </li>
    </ul>
    <p class="suave" th:if="${donaciones.isEmpty() and hayAlguna}">No hay donaciones en ese estado.</p>
    <th:block th:if="${!hayAlguna}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('truck', 'Aún no recibiste donaciones', 'El equipo de DonaTrack asigna las donaciones según las necesidades que cargues. Cuando te asigne una, la vas a ver acá.', '/entidad/panel', 'Ver mis necesidades')}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
