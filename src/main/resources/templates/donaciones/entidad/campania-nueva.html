<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Nueva campaña', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/entidad/panel}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Mi entidad</a></nav>
    <div class="encabezado-pagina"><div><h1>Nueva campaña</h1><p>Definí el período y para qué estás juntando donaciones.</p></div></div>
    <form class="formulario tarjeta" method="post" th:action="@{/entidad/campanias}" data-carga>
      <div class="campo">
        <label for="descripcionGeneral">¿De qué se trata? <span class="requerido" aria-hidden="true">*</span></label>
        <textarea id="descripcionGeneral" name="descripcionGeneral" required maxlength="300" placeholder="Ej.: Campaña de abrigo para el invierno"></textarea>
      </div>
      <div class="grupo-2">
        <div class="campo"><label for="fechaInicio">Empieza <span class="requerido" aria-hidden="true">*</span></label>
          <input id="fechaInicio" name="fechaInicio" type="date" required></div>
        <div class="campo"><label for="fechaFin">Termina <span class="requerido" aria-hidden="true">*</span></label>
          <input id="fechaFin" name="fechaFin" type="date" required aria-describedby="fin-ayuda">
          <p id="fin-ayuda" class="ayuda">Tiene que ser una fecha futura.</p></div>
      </div>
      <div class="fila">
        <button class="btn btn-sol btn-grande btn-bloque" type="submit" data-cargando="Creando…">Crear campaña</button>
        <a class="btn btn-secundario btn-grande btn-bloque" th:href="@{/entidad/panel}" data-carga>Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
