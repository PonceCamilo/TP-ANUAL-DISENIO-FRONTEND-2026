<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Donaciones disponibles', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/entidad/panel}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Mi entidad</a></nav>
    <div class="encabezado-pagina"><div><h1>Donaciones disponibles</h1>
      <p>Donaciones en depósito que coinciden con tus necesidades.</p></div></div>
    <ul class="lista" th:if="${!donaciones.isEmpty()}">
      <li class="item" th:each="d : ${donaciones}">
        <div class="item-cuerpo"><span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('box')}"></svg></span><div>
          <p class="item-titulo" th:text="${d.descripcion}">Frazadas</p>
          <p class="suave chico"><span th:text="${d.subcategoria}">Abrigo</span> ·
            <span th:text="${#strings.substring(d.fechaDonacion, 0, 10)}">2026-06-24</span></p>
        </div></div>
        <form method="post" th:action="@{/entidad/disponibles/{id}/aceptar(id=${d.id})}" data-carga>
          <button class="btn btn-sol" type="submit" data-cargando="Aceptando…"><svg th:replace="~{comun/fragmentos/componentes :: ic('check')}"></svg>Aceptar donación</button>
        </form>
      </li>
    </ul>
    <th:block th:if="${donaciones.isEmpty()}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('search', 'Nada por ahora', 'Cuando llegue una donación que coincida con tus necesidades, la vas a ver acá y te vamos a avisar.', null, null)}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
