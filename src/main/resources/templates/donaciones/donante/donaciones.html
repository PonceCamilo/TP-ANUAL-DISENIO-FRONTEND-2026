<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Mis donaciones', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <div class="encabezado-pagina">
      <div><h1>Mis donaciones</h1><p>Tocá una para ver por dónde va.</p></div>
      <a class="btn btn-sol" th:href="@{/donante/donar}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('plus')}"></svg>Nueva donación</a>
    </div>

    <form method="get" th:action="@{/donante/donaciones}" class="tarjeta" style="margin-bottom: var(--s-4)"
          aria-label="Filtrar mis donaciones">
      <div class="campo" style="max-width:20rem">
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
          <option value="" th:selected="${estadoFiltro == ''}">Todos</option>
          <option value="EN_DEPOSITO" th:selected="${estadoFiltro == 'EN_DEPOSITO'}">En depósito</option>
          <option value="ASIGNACION_REALIZADA" th:selected="${estadoFiltro == 'ASIGNACION_REALIZADA'}">Entidad asignada</option>
          <option value="LISTA_PARA_ENTREGAR" th:selected="${estadoFiltro == 'LISTA_PARA_ENTREGAR'}">Lista para entregar</option>
          <option value="EN_TRASLADO" th:selected="${estadoFiltro == 'EN_TRASLADO'}">En camino</option>
          <option value="ENTREGADA" th:selected="${estadoFiltro == 'ENTREGADA'}">Entregada</option>
          <option value="ENTREGA_FALLIDA" th:selected="${estadoFiltro == 'ENTREGA_FALLIDA'}">Entrega fallida</option>
          <option value="VENCIDA" th:selected="${estadoFiltro == 'VENCIDA'}">Vencida</option>
        </select>
      </div>
      <fieldset class="campo" th:if="${!catalogo.isEmpty()}">
        <legend class="fila">Tipo de lo que donaste
          <span th:replace="~{comun/fragmentos/componentes :: ayuda('filtro-tipo', 'Podés elegir varios tipos: se muestran las donaciones de cualquiera de ellos.')}"></span></legend>
        <div class="opciones">
          <label class="opcion" th:each="tipo, i : ${catalogo}">
            <input type="checkbox" name="subcategoria" th:value="${tipo}"
                   th:checked="${subcategoriasElegidas.contains(tipo)}"> <span th:text="${tipo}">Abrigo</span>
          </label>
        </div>
      </fieldset>
      <div class="fila">
        <button class="btn btn-secundario" type="submit"><svg th:replace="~{comun/fragmentos/componentes :: ic('search')}"></svg>Filtrar</button>
        <a class="btn btn-secundario" th:if="${hayFiltros}" th:href="@{/donante/donaciones}" data-carga>Quitar filtros</a>
      </div>
    </form>

    <p class="suave chico" th:if="${pagina.totalElementos > 0}" role="status"
       th:text="${pagina.totalElementos == 1} ? 'Una donación' : ${pagina.totalElementos} + ' donaciones'">3 donaciones</p>

    <ul class="lista" th:if="${!donaciones.isEmpty()}">
      <li th:each="d : ${donaciones}">
        <a class="item" th:href="@{/donante/donaciones/{id}(id=${d.id})}" data-carga>
          <div class="item-cuerpo">
            <span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('box')}"></svg></span>
            <div>
              <p class="item-titulo" th:text="${d.descripcion}">Ropa de abrigo</p>
              <p class="suave chico" style="margin:0">
                <span th:text="${d.subcategoria}">Abrigo</span> ·
                <time th:datetime="${d.fechaDonacion}" th:text="${#strings.substring(d.fechaDonacion, 0, 10)}">2026-06-24</time>
              </p>
            </div>
          </div>
          <span th:replace="~{comun/fragmentos/componentes :: estado(${d.estado})}"></span>
        </a>
      </li>
    </ul>
    <nav th:replace="~{donaciones/admin/fragmentos :: paginador(${pagina}, ${urlAnterior}, ${urlSiguiente})}"></nav>
    <th:block th:if="${donaciones.isEmpty()}">
      <div th:replace="~{comun/fragmentos/componentes :: vacio('box', 'No hay donaciones para mostrar', 'Cambiá el filtro o registrá una donación nueva.', '/donante/donar', 'Hacer una donación')}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
