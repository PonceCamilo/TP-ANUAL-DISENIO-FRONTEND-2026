<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Completá tu perfil', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <div class="encabezado-pagina"><div><h1>Un último paso</h1>
      <p>Es tu primera vez acá. Necesitamos unos datos para poder avisarte y asignar tus donaciones.</p></div></div>

    <form class="formulario tarjeta" method="post" th:action="@{/donante/registro}" data-carga>
      <p class="ayuda">Tu email (<strong th:text="${usuario.email}"></strong>) ya está confirmado. Los campos con <span class="requerido">*</span> son obligatorios.</p>
      <div class="grupo-2">
        <div class="campo"><label for="nombre">Nombre <span class="requerido" aria-hidden="true">*</span></label>
          <input id="nombre" name="nombre" required autocomplete="given-name" th:value="${usuario.primerNombre}"></div>
        <div class="campo"><label for="apellido">Apellido <span class="requerido" aria-hidden="true">*</span></label>
          <input id="apellido" name="apellido" required autocomplete="family-name"></div>
      </div>
      <div class="grupo-2">
        <div class="campo"><label for="tipoDocumento">Tipo de documento</label>
          <select id="tipoDocumento" name="tipoDocumento"><option>DNI</option><option>LE</option><option>LC</option><option>Pasaporte</option></select></div>
        <div class="campo"><label for="numeroDocumento">Número <span class="requerido" aria-hidden="true">*</span></label>
          <input id="numeroDocumento" name="numeroDocumento" required inputmode="numeric"></div>
      </div>
      <div class="grupo-2">
        <div class="campo"><label for="fechaNacimiento">Fecha de nacimiento <span class="requerido" aria-hidden="true">*</span></label>
          <input id="fechaNacimiento" name="fechaNacimiento" type="date" required autocomplete="bday"></div>
        <div class="campo"><label for="genero">Género</label>
          <select id="genero" name="genero"><option value="FEMENINO">Femenino</option><option value="MASCULINO">Masculino</option>
            <option value="NO_BINARIO">No binario</option><option value="OTRO">Otro</option></select></div>
      </div>
      <fieldset class="campo" style="border:0;padding:0;margin:0">
        <legend>Dirección</legend>
        <div class="grupo-2">
          <div class="campo"><label for="calle">Calle <span class="requerido" aria-hidden="true">*</span></label><input id="calle" name="calle" required autocomplete="address-line1"></div>
          <div class="campo"><label for="numero">Número <span class="requerido" aria-hidden="true">*</span></label><input id="numero" name="numero" type="number" min="0" required></div>
          <div class="campo"><label for="codigoPostal">Código postal <span class="requerido" aria-hidden="true">*</span></label><input id="codigoPostal" name="codigoPostal" required autocomplete="postal-code"></div>
          <th:block th:replace="~{comun/fragmentos/ubicacion :: provincia-localidad(true)}"></th:block>
        </div>
      </fieldset>
      <button type="submit" class="btn btn-grande" data-cargando="Guardando…">Guardar y continuar</button>
    </form>
  </div>
</main>
</body>
</html>
