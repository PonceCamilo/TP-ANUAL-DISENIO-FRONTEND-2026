<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('No recibidas', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav class="migas" aria-label="Ruta"><a th:href="@{/admin/panel}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>Administración</a></nav>
    <div class="encabezado-pagina">
      <div>
        <h1>Entregas no recibidas</h1>
        <p>Casos que informó el chofer y quedan para revisión.</p>
      </div>
    </div>

    <ul class="lista" th:if="${!entregas.isEmpty()}">
      <li th:each="e : ${entregas}">
        <a class="item" th:href="@{/admin/entregas/{id}(id=${e['id']})}" data-carga>
          <div class="item-cuerpo">
            <span class="icono-circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('alert')}"></svg></span>
            <div>
              <p class="item-titulo" th:text="${e['resumen'] != null and !#strings.isEmpty(e['resumen'])} ? ${e['resumen']} : |Donación ${e['idDonacion']}|">Donación</p>
              <p class="suave chico" style="margin:0" th:if="${e['nombreEntidad'] != null}" th:text="'Para ' + ${e['nombreEntidad']}">Para Comedor</p>
              <p class="suave chico" style="margin:0" th:text="${e['motivoTexto']}">Motivo</p>
            </div>
          </div>
        </a>
      </li>
    </ul>
    <div class="tarjeta vacio" th:if="${entregas.isEmpty()}">
      <div class="circulo"><svg th:replace="~{comun/fragmentos/componentes :: ic('check')}"></svg></div>
      <h2>No hay entregas para revisar</h2>
      <p>Cuando un chofer registre un incidente, el caso aparece acá.</p>
    </div>
  </div>
</main>
</body>
</html>
