<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{comun/fragmentos/base :: pagina('Entrega', ~{::main})}">
<body>
<main id="contenido" tabindex="-1">
  <div class="contenedor">
    <nav th:replace="~{donaciones/admin/fragmentos :: pestanias(${pestania})}"></nav>
    <nav class="migas" aria-label="Ruta"><a th:href="@{/admin/entregas/no-recibidas}" data-carga><svg th:replace="~{comun/fragmentos/componentes :: ic('arrow-left')}"></svg>No recibidas</a></nav>
    <div class="encabezado-pagina">
      <div>
        <h1>Entrega no recibida</h1>
        <p>
          <span th:text="${entrega['resumen'] != null and !#strings.isEmpty(entrega['resumen'])} ? ${entrega['resumen']} : 'Donación'">4 kg de Arroz</span>
          <th:block th:if="${entrega['nombreEntidad'] != null}"> para <strong th:text="${entrega['nombreEntidad']}">Comedor</strong></th:block>
        </p>
      </div>
    </div>
    <p><a th:href="@{/admin/donaciones/{id}(id=${entrega['idDonacion']})}" data-carga>Ver la donación</a></p>

    <p th:text="${entrega['motivoTexto']}">Motivo</p>
    <p class="suave" th:if="${entrega['camionId'] != null}">
      Camión <a th:href="@{/admin/flota/{id}(id=${entrega['camionId']})}" th:text="${entrega['camionId']}" data-carga>id</a>
    </p>

    <section class="tarjeta seccion" aria-labelledby="t-hist">
      <h2 id="t-hist" style="font-size: var(--t-lg)">Historial</h2>
      <ol class="tiempo" th:if="${entrega['historial'] != null and !entrega['historial'].isEmpty()}">
        <li th:each="h : ${entrega['historial']}">
          <p class="item-titulo" th:text="${h['estado']}">Estado</p>
          <p class="suave chico" style="margin:0" th:if="${h['fechaHora'] != null}"
             th:text="${#strings.replace(#strings.substring(h['fechaHora'], 0, 16), 'T', ' ')}">Fecha</p>
          <p class="chico" style="margin:0" th:if="${h['motivoFallo'] != null}" th:text="${h['motivoFallo']}">Motivo</p>
          <p class="chico" style="margin:0" th:if="${h['observacion'] != null}" th:text="${h['observacion']}">Nota</p>
        </li>
      </ol>
    </section>

    <form th:if="${entrega['replanificable'] and entrega['estado'] == 'NO_RECIBIDA'}" method="post" class="seccion"
          th:action="@{/admin/entregas/{id}/regreso-deposito(id=${entrega['id']})}" data-carga>
      <button class="btn btn-sol btn-grande" type="submit" data-cargando="Guardando…">Regresar al depósito</button>
    </form>
    <p class="seccion" th:if="${!entrega['replanificable'] and entrega['estado'] == 'NO_RECIBIDA'}">Este caso no vuelve a salir. Quedó registrado.</p>
  </div>
</main>
</body>
</html>
